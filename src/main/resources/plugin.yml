name: ServerCasino
version: 0.4.1-preview
main: dev.server.casino.CasinoPlugin
api-version: '26.2'
softdepend: [Vault, AuthMe, CraftEngine, ServerGames]
commands:
  casino-demo:
    description: 创建或清除免费实体游乐机
    usage: /casino-demo create <game> [skin-id] 或 remove [game] 或 reload-models
  casino:
    description: 金币游乐场
    usage: /casino
permissions:
  casino.machine:
    default: op
  casino.use:
    default: true
